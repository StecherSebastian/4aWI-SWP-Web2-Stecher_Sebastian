<table>
    <thead>
        <tr>
            @for (column of columns(); track column.label) {
            <th> {{ column.label }} </th>
            }
        </tr>
    </thead>
    <tbody>
        @for (row of data(); track row) {
        <tr (click)="rowClick.emit(row)">
            @for (column of columns(); track column.key) {
            <td> {{ row[column.key] }} </td>
            }
        </tr>
        }
    </tbody>
</table>
